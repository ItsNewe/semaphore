[project]
name = "semaphore"
version = "0.2.0"
description = "SBOM + vulnerability scanning of running Docker images, with tiered Apprise alerts"
requires-python = ">=3.12"
dependencies = [
    "apprise>=1.9",
    "docker>=7.1",
]

[project.scripts]
semaphore = "semaphore.app:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
